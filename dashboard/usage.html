<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hermes Usage Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2d3a;
  --text: #e4e6eb;
  --text-secondary: #8b8fa3;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --green: #00b894;
  --orange: #fdcb6e;
  --red: #e17055;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 80px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 {
  font-size: 20px;
  font-weight: 600;
}
.header h1 span { color: var(--accent-light); }

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.controls select, .controls input {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
.controls select:focus, .controls input:focus {
  border-color: var(--accent);
}
.controls button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.controls button:active { opacity: 0.7; }

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}
.summary-card .value {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-light);
  margin-bottom: 4px;
}
.summary-card .label {
  font-size: 12px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.table-header h2 { font-size: 15px; font-weight: 600; }
.table-header .count {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg);
  padding: 2px 10px;
  border-radius: 12px;
}

table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13px;
}
th {
  text-align: left;
  padding: 10px 14px;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
th:hover { color: var(--text); }
th.sorted-asc::after { content: ' ▲'; font-size: 10px; }
th.sorted-desc::after { content: ' ▼'; font-size: 10px; }

td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover { background: rgba(108, 92, 231, 0.05); }

.user-id {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  color: var(--accent-light);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.num { text-align: right; font-variant-numeric: tabular-nums; }
.cost { color: var(--green); }
.last-active { color: var(--text-secondary); font-size: 12px; }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.empty .icon { font-size: 36px; margin-bottom: 12px; }

.loading {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error {
  text-align: center;
  padding: 20px;
  color: var(--red);
  background: rgba(225, 112, 85, 0.1);
  border-radius: 12px;
  margin-bottom: 20px;
}

@media (max-width: 600px) {
  body { padding: 12px; }
  .header h1 { font-size: 17px; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 12px; }
  td, th { padding: 8px 10px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Hermes <span>Usage</span></h1>
  <div class="controls">
    <select id="days">
      <option value="7">7 days</option>
      <option value="30" selected>30 days</option>
      <option value="90">90 days</option>
      <option value="365">1 year</option>
    </select>
    <input id="api-url" type="text" placeholder="API URL" style="width:180px">
    <input id="api-key" type="password" placeholder="API Key" style="width:140px">
    <button onclick="fetchData()">Refresh</button>
  </div>
</div>

<div id="error-box" class="error" style="display:none"></div>

<div class="summary" id="summary"></div>

<div class="table-wrap">
  <div class="table-header">
    <h2>Per-User Usage</h2>
    <span class="count" id="user-count">0 users</span>
  </div>
  <div id="table-body">
    <div class="loading"><div class="spinner"></div><div>Loading...</div></div>
  </div>
</div>

<script>
const DEFAULT_API = location.origin;
let sortKey = 'total_input';
let sortDir = 'desc';
let allUsers = [];

function getApiBase() {
  const v = document.getElementById('api-url').value.trim();
  return v || DEFAULT_API;
}

function getApiKey() {
  return document.getElementById('api-key').value.trim();
}

function fmt(n) {
  if (n == null) return '-';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtCost(n) {
  if (n == null) return '-';
  return '$' + Number(n).toFixed(2);
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return d.toLocaleDateString();
}

function sortUsers(key) {
  if (sortKey === key) {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  } else {
    sortKey = key;
    sortDir = 'desc';
  }
  renderTable();
}

function renderSummary(users) {
  const totalSessions = users.reduce((s, u) => s + (u.session_count || 0), 0);
  const totalTokens = users.reduce((s, u) => s + (u.total_input || 0) + (u.total_output || 0), 0);
  const totalCost = users.reduce((s, u) => s + (u.total_cost || 0), 0);
  const totalCache = users.reduce((s, u) => s + (u.total_cache_read || 0), 0);

  document.getElementById('summary').innerHTML = `
    <div class="summary-card"><div class="value">${users.length}</div><div class="label">Users</div></div>
    <div class="summary-card"><div class="value">${fmt(totalSessions)}</div><div class="label">Sessions</div></div>
    <div class="summary-card"><div class="value">${fmt(totalTokens)}</div><div class="label">Tokens</div></div>
    <div class="summary-card"><div class="value">${fmtCost(totalCost)}</div><div class="label">Est. Cost</div></div>
  `;
}

function renderTable() {
  const sorted = [...allUsers].sort((a, b) => {
    let va = a[sortKey] ?? 0, vb = b[sortKey] ?? 0;
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });

  const totalTokens = allUsers.reduce((s, u) => s + (u.total_input || 0) + (u.total_output || 0), 0) || 1;

  const columns = [
    { key: 'user_id', label: 'User', cls: 'user-id' },
    { key: 'session_count', label: 'Sessions', cls: 'num' },
    { key: 'total_input', label: 'Input', cls: 'num' },
    { key: 'total_output', label: 'Output', cls: 'num' },
    { key: 'total_cache_read', label: 'Cache', cls: 'num' },
    { key: 'total_cost', label: 'Cost', cls: 'num cost' },
    { key: 'last_active', label: 'Last Active', cls: 'last-active' },
  ];

  const thtml = columns.map(c => {
    const cls = sortKey === c.key ? (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc') : '';
    return `<th class="${cls}" onclick="sortUsers('${c.key}')">${c.label}</th>`;
  }).join('');

  const fmtVal = (u, c) => {
    if (c.key === 'user_id') return `<td class="${c.cls}" title="${u.user_id || ''}">${u.user_id || '-'}</td>`;
    if (c.key === 'total_cost') return `<td class="${c.cls}">${fmtCost(u[c.key])}</td>`;
    if (c.key === 'last_active') return `<td class="${c.cls}">${fmtTime(u[c.key])}</td>`;
    return `<td class="${c.cls}">${fmt(u[c.key])}</td>`;
  };

  if (sorted.length === 0) {
    document.getElementById('table-body').innerHTML = `
      <div class="empty"><div class="icon">-</div><div>No data yet. Send requests with X-User-Id header.</div></div>`;
    return;
  }

  const rows = sorted.map(u => `<tr>${columns.map(c => fmtVal(u, c)).join('')}</tr>`).join('');
  document.getElementById('table-body').innerHTML = `<table><thead><tr>${thtml}</tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('user-count').textContent = allUsers.length + ' user' + (allUsers.length !== 1 ? 's' : '');
}

async function fetchData() {
  const box = document.getElementById('error-box');
  box.style.display = 'none';

  const days = document.getElementById('days').value;
  const base = getApiBase();
  const key = getApiKey();
  const url = `${base}/v1/admin/usage?days=${days}`;

  const headers = {};
  if (key) headers['Authorization'] = `Bearer ${key}`;

  try {
    document.getElementById('table-body').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
    const resp = await fetch(url, { headers });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    allUsers = data.users || [];
    renderSummary(allUsers);
    renderTable();
  } catch (e) {
    box.textContent = 'Error: ' + e.message;
    box.style.display = 'block';
    document.getElementById('table-body').innerHTML = '';
    document.getElementById('summary').innerHTML = '';
  }
}

// Auto-detect API key from URL hash
(function() {
  const hash = location.hash.slice(1);
  if (hash) {
    const params = new URLSearchParams(hash);
    if (params.get('key')) document.getElementById('api-key').value = params.get('key');
    if (params.get('url')) document.getElementById('api-url').value = params.get('url');
  }
})();

fetchData();
</script>
</body>
</html>
