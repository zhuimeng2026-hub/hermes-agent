<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hermes Usage Dashboard</title>
<style>
:root {
  --bg: #0f1117;
  --card: #1a1d27;
  --border: #2a2d3a;
  --text: #e4e6eb;
  --text-secondary: #8b8fa3;
  --accent: #6c5ce7;
  --accent-light: #a29bfe;
  --green: #00b894;
  --orange: #fdcb6e;
  --red: #e17055;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  padding: 16px;
  padding-bottom: 80px;
}

.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 20px; font-weight: 600; }
.header h1 span { color: var(--accent-light); }

.controls {
  display: flex;
  gap: 8px;
  align-items: center;
  flex-wrap: wrap;
}
.controls select, .controls input {
  background: var(--card);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 8px 12px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
.controls select:focus, .controls input:focus { border-color: var(--accent); }
.controls button {
  background: var(--accent);
  color: #fff;
  border: none;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  transition: opacity 0.2s;
}
.controls button:active { opacity: 0.7; }

.summary {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}
.summary-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  text-align: center;
}
.summary-card .value {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent-light);
  margin-bottom: 4px;
}
.summary-card .label {
  font-size: 12px;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.table-wrap {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.table-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
}
.table-header h2 { font-size: 15px; font-weight: 600; }
.table-header .count {
  font-size: 12px;
  color: var(--text-secondary);
  background: var(--bg);
  padding: 2px 10px;
  border-radius: 12px;
}

.table-scroll { overflow-x: auto; }

table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 1200px; }
th {
  text-align: left;
  padding: 10px 14px;
  color: var(--text-secondary);
  font-weight: 500;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  border-bottom: 1px solid var(--border);
  position: sticky;
  top: 0;
  background: var(--card);
  cursor: pointer;
  user-select: none;
  white-space: nowrap;
}
th:hover { color: var(--text); }
th.sorted-asc::after { content: ' \25B2'; font-size: 10px; }
th.sorted-desc::after { content: ' \25BC'; font-size: 10px; }

td {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tr:hover { background: rgba(108, 92, 231, 0.05); }
tr.exhausted { background: rgba(225, 112, 85, 0.08); }
tr.exhausted:hover { background: rgba(225, 112, 85, 0.14); }

.user-id {
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 12px;
  color: var(--accent-light);
  max-width: 160px;
  overflow: hidden;
  text-overflow: ellipsis;
}
.num { text-align: right; font-variant-numeric: tabular-nums; }
.cost { color: var(--green); }
.last-active { color: var(--text-secondary); font-size: 12px; }
.quota-exhausted { color: var(--red); font-weight: 600; }
.quota-ok { color: var(--green); }
.quota-unlimited { color: var(--text-secondary); font-style: italic; }

.btn-sm {
  background: var(--border);
  color: var(--text);
  border: none;
  padding: 4px 10px;
  border-radius: 6px;
  font-size: 11px;
  cursor: pointer;
  transition: background 0.2s;
}
.btn-sm:hover { background: var(--accent); }

.empty {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.empty .icon { font-size: 36px; margin-bottom: 12px; }

.loading {
  text-align: center;
  padding: 40px 20px;
  color: var(--text-secondary);
}
.spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 3px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 8px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.error {
  text-align: center;
  padding: 20px;
  color: var(--red);
  background: rgba(225, 112, 85, 0.1);
  border-radius: 12px;
  margin-bottom: 20px;
}

/* Modal */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  width: 90%;
  max-width: 380px;
}
.modal h3 { margin-bottom: 16px; font-size: 16px; }
.modal label {
  display: block;
  font-size: 12px;
  color: var(--text-secondary);
  margin-bottom: 4px;
  margin-top: 12px;
}
.modal input {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 10px 12px;
  border-radius: 8px;
  font-size: 14px;
  outline: none;
}
.modal input:focus { border-color: var(--accent); }
.modal-actions {
  display: flex;
  gap: 8px;
  margin-top: 20px;
  justify-content: flex-end;
}
.modal-actions button {
  padding: 8px 20px;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
  border: none;
}
.modal-actions .btn-cancel { background: var(--border); color: var(--text); }
.modal-actions .btn-save { background: var(--accent); color: #fff; }

@media (max-width: 600px) {
  body { padding: 12px; }
  .header h1 { font-size: 17px; }
  .summary { grid-template-columns: repeat(2, 1fr); }
  table { font-size: 12px; }
  td, th { padding: 8px 10px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>Hermes <span>Usage</span></h1>
  <div class="controls">
    <select id="days">
      <option value="7">7 days</option>
      <option value="30" selected>30 days</option>
      <option value="90">90 days</option>
      <option value="365">1 year</option>
    </select>
    <input id="api-url" type="text" placeholder="API URL" style="width:180px">
    <button onclick="fetchData()">Refresh</button>
  </div>
</div>

<div id="error-box" class="error" style="display:none"></div>

<div class="summary" id="summary"></div>

<div class="table-wrap">
  <div class="table-header">
    <h2>Per-User Usage</h2>
    <span class="count" id="user-count">0 users</span>
  </div>
  <div class="table-scroll" id="table-body">
    <div class="loading"><div class="spinner"></div><div>Loading...</div></div>
  </div>
</div>

<!-- Quota Modal -->
<div class="modal-overlay" id="quota-modal">
  <div class="modal">
    <h3>Set Quota: <span id="modal-user-id" style="color:var(--accent-light)"></span></h3>
    <label>Free quota (tokens)</label>
    <input type="number" id="modal-free" min="0" placeholder="0">
    <label>Paid quota (tokens)</label>
    <input type="number" id="modal-paid" min="0" placeholder="0">
    <label>Max usage days (0 = unlimited)</label>
    <input type="number" id="modal-max-days" min="0" placeholder="0">
    <label>Max requests (0 = unlimited)</label>
    <input type="number" id="modal-max-requests" min="0" placeholder="0">
    <label>Mode</label>
    <select id="modal-mode" style="width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:8px;font-size:14px;outline:none;margin-top:4px">
      <option value="set">Set (overwrite)</option>
      <option value="add">Add (increment)</option>
    </select>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeModal()">Cancel</button>
      <button class="btn-save" onclick="saveQuota()">Save</button>
    </div>
  </div>
</div>

<script>
const DEFAULT_API = location.origin;
let sortKey = 'total_input';
let sortDir = 'desc';
let allUsers = [];
let modalUserId = null;

function getApiBase() {
  const v = document.getElementById('api-url').value.trim();
  return v || DEFAULT_API;
}

function getApiKey() {
  return 'HDLMgsDz9VdPlnNr';
}

function authHeaders() {
  const key = getApiKey();
  const h = { 'Content-Type': 'application/json' };
  if (key) h['X-Api-Key'] = key;
  return h;
}

function fmt(n) {
  if (n == null) return '-';
  if (n < 0) return 'unlimited';
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return n.toLocaleString();
}

function fmtCost(n) {
  if (n == null) return '-';
  return '$' + Number(n).toFixed(2);
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  const now = new Date();
  const diff = (now - d) / 1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff / 60) + 'm ago';
  if (diff < 86400) return Math.floor(diff / 3600) + 'h ago';
  if (diff < 604800) return Math.floor(diff / 86400) + 'd ago';
  return d.toLocaleDateString();
}

function sortUsers(key) {
  if (sortKey === key) {
    sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  } else {
    sortKey = key;
    sortDir = 'desc';
  }
  renderTable();
}

function renderSummary(users) {
  const totalSessions = users.reduce((s, u) => s + (u.session_count || 0), 0);
  const totalTokens = users.reduce((s, u) => s + (u.total_input || 0) + (u.total_output || 0), 0);
  const totalCost = users.reduce((s, u) => s + (u.total_cost || 0), 0);
  const exhausted = users.filter(u => u.quota_exhausted).length;
  const expired = users.filter(u => u.max_days > 0 && u.days_remaining != null && u.days_remaining <= 0).length;
  const reqExhausted = users.filter(u => u.max_requests > 0 && (u.requests_used || 0) >= u.max_requests).length;

  document.getElementById('summary').innerHTML = `
    <div class="summary-card"><div class="value">${users.length}</div><div class="label">Users</div></div>
    <div class="summary-card"><div class="value">${fmt(totalSessions)}</div><div class="label">Sessions</div></div>
    <div class="summary-card"><div class="value">${fmt(totalTokens)}</div><div class="label">Tokens</div></div>
    <div class="summary-card"><div class="value">${fmtCost(totalCost)}</div><div class="label">Est. Cost</div></div>
    <div class="summary-card"><div class="value" style="color:${exhausted > 0 ? 'var(--red)' : 'var(--green)'}">${exhausted}</div><div class="label">Token Exhausted</div></div>
    <div class="summary-card"><div class="value" style="color:${expired > 0 ? 'var(--red)' : 'var(--green)'}">${expired}</div><div class="label">Days Expired</div></div>
    <div class="summary-card"><div class="value" style="color:${reqExhausted > 0 ? 'var(--red)' : 'var(--green)'}">${reqExhausted}</div><div class="label">Reqs Exhausted</div></div>
  `;
}

function renderTable() {
  const sorted = [...allUsers].sort((a, b) => {
    let va = a[sortKey] ?? 0, vb = b[sortKey] ?? 0;
    if (typeof va === 'string') return sortDir === 'asc' ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir === 'asc' ? va - vb : vb - va;
  });

  const columns = [
    { key: 'user_id', label: 'User', cls: 'user-id' },
    { key: 'session_count', label: 'Sessions', cls: 'num' },
    { key: 'total_input', label: 'Input', cls: 'num' },
    { key: 'total_output', label: 'Output', cls: 'num' },
    { key: 'total_cache_read', label: 'Cache', cls: 'num' },
    { key: 'total_cost', label: 'Cost', cls: 'num cost' },
    { key: 'total_quota', label: 'Token Quota', cls: 'num' },
    { key: 'remaining_tokens', label: 'Remaining', cls: 'num' },
    { key: 'max_days', label: 'Days Limit', cls: 'num' },
    { key: 'days_remaining', label: 'Days Left', cls: 'num' },
    { key: 'max_requests', label: 'Req Limit', cls: 'num' },
    { key: 'requests_used', label: 'Reqs Used', cls: 'num' },
    { key: 'last_active', label: 'Last Active', cls: 'last-active' },
    { key: '_actions', label: '', cls: '' },
  ];

  const thtml = columns.filter(c => c.key !== '_actions').map(c => {
    const cls = sortKey === c.key ? (sortDir === 'asc' ? 'sorted-asc' : 'sorted-desc') : '';
    return `<th class="${cls}" onclick="sortUsers('${c.key}')">${c.label}</th>`;
  }).join('') + '<th></th>';

  const fmtVal = (u, c) => {
    if (c.key === 'user_id') return `<td class="${c.cls}" title="${u.user_id || ''}">${u.user_id || '-'}</td>`;
    if (c.key === 'total_cost') return `<td class="${c.cls}">${fmtCost(u[c.key])}</td>`;
    if (c.key === 'last_active') return `<td class="${c.cls}">${fmtTime(u[c.key])}</td>`;
    if (c.key === 'total_quota') {
      const q = u.total_quota || 0;
      if (q <= 0) return `<td class="quota-unlimited">unlimited</td>`;
      return `<td class="num">${fmt(q)}</td>`;
    }
    if (c.key === 'remaining_tokens') {
      const q = u.total_quota || 0;
      if (q <= 0) return `<td class="quota-unlimited">-</td>`;
      const r = u.remaining_tokens ?? 0;
      const cls = r <= 0 ? 'quota-exhausted' : 'quota-ok';
      return `<td class="num ${cls}">${fmt(r)}</td>`;
    }
    if (c.key === 'max_days') {
      const v = u.max_days || 0;
      return `<td class="${v > 0 ? 'num' : 'quota-unlimited'}">${v > 0 ? v + 'd' : '-'}</td>`;
    }
    if (c.key === 'days_remaining') {
      const v = u.max_days || 0;
      if (v <= 0) return `<td class="quota-unlimited">-</td>`;
      const r = u.days_remaining;
      if (r == null) return `<td class="quota-unlimited">-</td>`;
      const cls = r <= 0 ? 'quota-exhausted' : 'quota-ok';
      return `<td class="num ${cls}">${r}d</td>`;
    }
    if (c.key === 'max_requests') {
      const v = u.max_requests || 0;
      return `<td class="${v > 0 ? 'num' : 'quota-unlimited'}">${v > 0 ? fmt(v) : '-'}</td>`;
    }
    if (c.key === 'requests_used') {
      const v = u.max_requests || 0;
      if (v <= 0) return `<td class="quota-unlimited">-</td>`;
      const used = u.requests_used || 0;
      const cls = used >= v ? 'quota-exhausted' : 'num';
      return `<td class="${cls}">${fmt(used)} / ${fmt(v)}</td>`;
    }
    if (c.key === '_actions') return `<td><button class="btn-sm" onclick="openQuotaModal('${u.user_id}')">Quota</button></td>`;
    return `<td class="${c.cls}">${fmt(u[c.key])}</td>`;
  };

  if (sorted.length === 0) {
    document.getElementById('table-body').innerHTML = `
      <div class="empty"><div class="icon">-</div><div>No data yet. Send requests with X-User-Id header.</div></div>`;
    return;
  }

  const rows = sorted.map(u => {
    const cls = u.quota_exhausted ? 'exhausted' : '';
    return `<tr class="${cls}">${columns.map(c => fmtVal(u, c)).join('')}</tr>`;
  }).join('');
  document.getElementById('table-body').innerHTML = `<table><thead><tr>${thtml}</tr></thead><tbody>${rows}</tbody></table>`;
  document.getElementById('user-count').textContent = allUsers.length + ' user' + (allUsers.length !== 1 ? 's' : '');
}

// ── Quota modal ──

function openQuotaModal(userId) {
  modalUserId = userId;
  const u = allUsers.find(x => x.user_id === userId) || {};
  document.getElementById('modal-user-id').textContent = userId;
  document.getElementById('modal-free').value = u.free_quota || '';
  document.getElementById('modal-paid').value = u.paid_quota || '';
  document.getElementById('modal-max-days').value = u.max_days || '';
  document.getElementById('modal-max-requests').value = u.max_requests || '';
  document.getElementById('modal-mode').value = 'set';
  document.getElementById('quota-modal').classList.add('active');
}

function closeModal() {
  document.getElementById('quota-modal').classList.remove('active');
  modalUserId = null;
}

async function saveQuota() {
  if (!modalUserId) return;
  const free = parseInt(document.getElementById('modal-free').value) || 0;
  const paid = parseInt(document.getElementById('modal-paid').value) || 0;
  const maxDays = parseInt(document.getElementById('modal-max-days').value) || 0;
  const maxRequests = parseInt(document.getElementById('modal-max-requests').value) || 0;
  const mode = document.getElementById('modal-mode').value;
  const base = getApiBase();

  try {
    const resp = await fetch(`${base}/v1/admin/quota`, {
      method: 'POST',
      headers: authHeaders(),
      body: JSON.stringify({
        user_id: modalUserId,
        free_quota: free,
        paid_quota: paid,
        max_days: maxDays,
        max_requests: maxRequests,
        mode,
      }),
    });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error || `HTTP ${resp.status}`);
    }
    closeModal();
    await fetchQuotas();
  } catch (e) {
    alert('Error: ' + e.message);
  }
}

// Close modal on overlay click
document.getElementById('quota-modal').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

// ── Data fetching ──

async function fetchQuotas() {
  const base = getApiBase();
  const headers = authHeaders();
  // Fetch quota for each user
  const promises = allUsers.map(async u => {
    try {
      const resp = await fetch(`${base}/v1/admin/quota/${encodeURIComponent(u.user_id)}`, { headers });
      if (resp.ok) {
        const q = await resp.json();
        u.total_quota = q.total_quota || 0;
        u.free_quota = q.free_quota || 0;
        u.paid_quota = q.paid_quota || 0;
        u.remaining_tokens = q.remaining_tokens ?? 0;
        u.quota_exhausted = q.exhausted || false;
        u.max_days = q.max_days || 0;
        u.max_requests = q.max_requests || 0;
        u.first_seen_at = q.first_seen_at;
        u.days_remaining = q.days_remaining;
        u.requests_used = q.requests_used || 0;
      } else {
        u.total_quota = 0;
        u.remaining_tokens = 0;
        u.quota_exhausted = false;
        u.max_days = 0;
        u.max_requests = 0;
        u.first_seen_at = null;
        u.days_remaining = null;
        u.requests_used = 0;
      }
    } catch {
      u.total_quota = 0;
      u.remaining_tokens = 0;
      u.quota_exhausted = false;
      u.max_days = 0;
      u.max_requests = 0;
      u.first_seen_at = null;
      u.days_remaining = null;
      u.requests_used = 0;
    }
  });
  await Promise.all(promises);
}

async function fetchData() {
  const box = document.getElementById('error-box');
  box.style.display = 'none';

  const days = document.getElementById('days').value;
  const base = getApiBase();
  const headers = authHeaders();

  try {
    document.getElementById('table-body').innerHTML = '<div class="loading"><div class="spinner"></div><div>Loading...</div></div>';
    const resp = await fetch(`${base}/v1/admin/usage?days=${days}`, { headers });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      throw new Error(err.error?.message || `HTTP ${resp.status}`);
    }
    const data = await resp.json();
    allUsers = data.users || [];

    // Enrich with quota data
    await fetchQuotas();

    renderSummary(allUsers);
    renderTable();
  } catch (e) {
    box.textContent = 'Error: ' + e.message;
    box.style.display = 'block';
    document.getElementById('table-body').innerHTML = '';
    document.getElementById('summary').innerHTML = '';
  }
}

// Auto-detect API key from URL hash
(function() {
  const hash = location.hash.slice(1);
  if (hash) {
    const params = new URLSearchParams(hash);
    if (params.get('key')) document.getElementById('api-key').value = params.get('key');
    if (params.get('url')) document.getElementById('api-url').value = params.get('url');
  }
})();

fetchData();
</script>
</body>
</html>
